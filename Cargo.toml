[package]
name = "pdf-inspector"
version = "0.1.0"
edition = "2021"
autobins = false
authors = ["Firecrawl Team"]
description = "Fast PDF inspection, classification, and text extraction with smart scanned vs text-based detection"
license = "MIT"
repository = "https://github.com/firecrawl/pdf-inspector"

[lib]
name = "pdf_inspector"
crate-type = ["lib", "cdylib"]

[dependencies]
# Python bindings
pyo3 = { version = "0.25", features = ["extension-module"], optional = true }

# Error handling
thiserror = "2.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Text processing
regex = "1.10"
once_cell = "1.19"
unicode-normalization = "0.1"

# TrueType font parsing (for Identity-H CID font cmap extraction)
ttf-parser = "0.25"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Parallel processing
rayon = "1.10"
# PDF parsing with threading
lopdf = { git = "https://github.com/J-F-Liu/lopdf", rev = "7a05512d831415b1f2b1ce522391d6beab8a1284", features = ["rayon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# PDF parsing without threading for WASM
lopdf = { git = "https://github.com/J-F-Liu/lopdf", rev = "7a05512d831415b1f2b1ce522391d6beab8a1284", default-features = false, features = ["chrono", "jiff", "time"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"

[dev-dependencies]
tempfile = "3.3"

[features]
default = []
python = ["pyo3"]

[[bin]]
name = "pdf2md"
path = "src/bin/pdf2md.rs"

[[bin]]
name = "detect-pdf"
path = "src/bin/detect_pdf.rs"

[[bin]]
name = "dump_ops"
path = "src/bin/dump_ops.rs"
