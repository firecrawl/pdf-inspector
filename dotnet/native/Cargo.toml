[package]
name = "pdf-inspector-dotnet-native"
version = "1.17.0"
edition = "2021"
publish = false

[lib]
name = "pdf_inspector_dotnet"
crate-type = ["cdylib"]

[dependencies]
pdf-inspector = { path = "../..", features = ["embedded-cmaps", "ocr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = "debuginfo"
